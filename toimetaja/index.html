<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onu Sano · Toimetaja</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="description" content="Toimetaja — 1920×1080 Arvamuse pilt: foto või kollaaž, hägustatud näod, tsitaadimull ja autori nägu ringis.">
<meta property="og:type" content="website">
<meta property="og:title" content="Onu Sano · Toimetaja">
<meta property="og:description" content="Toimetaja — 1920×1080 Arvamuse pilt: foto või kollaaž, hägustatud näod, tsitaadimull ja autori nägu ringis.">
<meta property="og:image" content="assets/onusano-og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/onusano-og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Shared page transition — slides the tool in from the right (reversed on Back). -->
<link rel="stylesheet" href="../assets/transition.css">
<script src="../assets/transition.js"></script>
<style>
  :root {
    --bg:           #f6f9fa;   /* app base: delfi-lightgray at 50% over white */
    --card:         #ffffff;   /* card / panel surface */
    --border:       #ebebeb;   /* canvas card hairline */
    --border-2:     #dedfe0;   /* sidebar + floating toolbar hairline */
    --ink:          #111317;   /* near-black: text + solid fills */
    --muted:        #708597;   /* delfi-darkgray: secondary text */
    --track:        #edf2f4;   /* delfi-lightgray: empty well + selected-chip fill */
    --hover:        #f2f4f6;   /* subtle hover wash on light controls */
    --accent:       #fa044f;   /* delfi-red: destructive action + selection chrome */
    --focus:        #000000;   /* keyboard / active focus ring */
    --shadow-card:  0 4px 5px rgba(0,0,0,0.10);
    --shadow-canvas:0 4px 10px rgba(0,0,0,0.10);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Google Sans Flex", "Google Sans", "Product Sans", "DM Sans",
                 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    color-scheme: light;
    background: linear-gradient(rgba(237,242,244,0.5), rgba(237,242,244,0.5)) #fff;
  }

  .hidden { display: none !important; }

  /* ───── App shell: attached 300px left sidebar (Kollaažer) + centre column (Hägustaja) ───── */
  .app-shell {
    height: 100%;
    display: flex;
    flex-direction: row;
  }

  /* ───── Left sidebar (Elements · Format) ───── */
  .sidebar {
    flex: 0 0 auto;
    width: 300px;
    height: 100%;
    background: var(--card);
    border-right: 1px solid var(--border-2);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  /* Centred when there's room, scrollable from the top when there isn't — auto margins
     collapse to 0 once the content overflows, unlike justify-content: center. */
  .side-section:first-child { margin-top: auto; }
  .side-section:last-child  { margin-bottom: auto; }
  .side-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }
  .side-section.elements { border-bottom: 1px solid var(--border-2); padding-bottom: 20px; }
  .side-section.formats  { padding-bottom: 28px; }
  .side-heading {
    margin: 0;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    text-align: center;
  }
  .side-note {
    margin: -4px 0 0;
    font-size: 11px;
    line-height: 1.4;
    color: var(--muted);
    text-align: center;
    max-width: 220px;
  }

  /* Element gallery — the two Arvamus graphics, drawn by JS with the same painter the
     canvas uses, so the thumbnail is the real thing at a small size. Click adds one. */
  .element-list {
    width: 226px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .element-thumb {
    appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    color: var(--ink);
    padding: 6px 2px 8px;
    border-radius: 8px;
    cursor: pointer;
    touch-action: none;       /* the thumb can also be dragged onto the board */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: background-color 0.15s, opacity 0.15s;
  }
  .element-thumb:hover { background: var(--hover); }
  .element-thumb:active { background: var(--track); }
  .element-thumb:disabled { opacity: 0.4; cursor: default; }
  .element-thumb:disabled:hover { background: transparent; }
  .element-thumb .el-preview {
    width: 56px;
    height: 56px;
    display: block;
  }
  .element-thumb .el-name {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
  }
  .element-thumb .el-plus {
    font-weight: 400;
    color: var(--muted);
  }

  /* Format — two choices at rest: one 16:9 photo or a collage (the default). */
  .mode-list {
    width: 226px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .mode-chip {
    appearance: none;
    border: 1px solid var(--border-2);
    background: var(--card);
    font: inherit;
    color: var(--ink);
    padding: 10px 8px 9px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .mode-chip .ico { width: 22px; height: 22px; display: block; }
  .mode-chip:hover { background: var(--hover); }
  .mode-chip.selected { background: var(--track); border-color: var(--ink); }

  /* The collage panel unfolds under "Kollaaž" (grid rows 0fr → 1fr animate the height) and
     is inert while folded, so its buttons are out of the tab order. */
  .collage-panel {
    width: 226px;
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    overflow: hidden;
    transition: grid-template-rows 0.28s ease, opacity 0.2s ease;
  }
  .collage-panel.open { grid-template-rows: 1fr; opacity: 1; }
  .collage-inner {
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 6px 4px 4px;    /* room for focus rings inside the clipping panel */
  }
  .stroke-block {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid var(--border-2);
  }

  /* Format gallery (Kollaažer) — the grid templates, two per row. Thumbs are drawn by JS
     from the same template table the canvas uses, so the preview always matches the fill
     order. */
  .format-list {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .format-thumb {
    appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    padding: 6px;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .format-thumb:hover { background: var(--hover); }
  .format-thumb.selected { background: var(--track); }
  .format-thumb .mini-board {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--muted);
    border-radius: 2px;
    overflow: hidden;
    background: var(--card);
  }
  .format-thumb.selected .mini-board { border-color: var(--ink); }
  .format-thumb .mini-cell {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    border: 1px solid var(--border-2);
    font-size: 10px;
    line-height: 1;
    color: var(--ink);
  }

  /* Stroke color — the colour of the seams between collage cells. */
  .stroke-list { display: flex; align-items: center; gap: 4px; }
  .stroke-chip {
    appearance: none;
    border: none;
    background: transparent;
    padding: 8px;
    border-radius: 16px;
    cursor: pointer;
    display: inline-flex;
    transition: background-color 0.15s;
  }
  .stroke-chip:hover { background: var(--hover); }
  .stroke-chip.selected { background: var(--track); }
  .stroke-chip .swatch { width: 36px; height: 36px; border-radius: 8px; display: block; }
  .stroke-chip[data-stroke="#ffffff"] .swatch { background: #fff; border: 1px solid var(--border-2); }
  .stroke-chip[data-stroke="#000000"] .swatch { background: #000; }

  /* ───── Centre column: header · canvas · hint · floating toolbar ───── */
  .main-column {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px;
  }

  .app-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 400;
  }
  .brand-face { height: 36px; width: auto; display: block; }
  .brand-name { font-weight: 700; }
  .brand-sub  { font-weight: 300; }
  .brand-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .brand-face { transform-origin: right center; transition: transform .2s ease; }
  .app-header:hover .brand-face { transform: rotate(-4deg); }

  /* ───── Canvas area ───── */
  .canvas-area {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 24px 0;
  }

  /* White card with the full-resolution 1920×1080 board scaled to fit. */
  .canvas-card {
    position: relative;
    background: var(--card);
    box-shadow: var(--shadow-canvas);
  }
  .stage { position: relative; }
  #board { display: block; touch-action: none; cursor: default; }

  /* Cell chrome — selection (delfi-red, like the sister tools) and the drop / swap target. */
  .cell-ol {
    position: absolute;
    pointer-events: none;
    box-sizing: border-box;
    border: 2px solid var(--accent);
  }
  .cell-drop {
    position: absolute;
    pointer-events: none;
    box-sizing: border-box;
    border: 2px dashed var(--ink);
    border-radius: 8px;
    background: rgba(17,19,23,0.04);
  }

  /* Element chrome — visual only; all hit-testing is done in JS on the canvas. */
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .el-ol {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 1.5px dashed rgba(255,255,255,0.95);
    box-shadow: 0 0 0 1px rgba(17,19,23,0.45), inset 0 0 0 1px rgba(17,19,23,0.30);
  }
  .el-ol.selected {
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.85), inset 0 0 0 1px rgba(255,255,255,0.55);
  }
  /* A photo being dragged from the desktop over a face ring → that ring lights up. */
  .el-ol.drop-hover {
    border: 2px dashed var(--ink);
    background: rgba(17,19,23,0.06);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.85);
  }
  .resize-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    box-shadow: var(--shadow-card);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  /* Blur ellipses (Hägustaja): side handles stretch one axis, the corner one scales both. */
  .resize-handle.rh-side { width: 11px; height: 11px; }

  /* ───── Floating pill toolbars (per element · per cell) ─────
     Live in stage space so they keep their designed footprint at any canvas zoom;
     the element one sits under its element (flipped above when there's no room), the
     cell one over the cell's bottom edge, as in Kollaažer. */
  .pill-toolbar {
    position: absolute;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border-2);
    border-radius: 100px;
    box-shadow: var(--shadow-card);
    padding: 4px;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .ct-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink);
    width: 26px;
    height: 26px;
    flex: 0 0 auto;
    border-radius: 100px;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s;
  }
  .ct-btn:hover { background: var(--hover); }
  .ct-btn .ico { width: 15px; height: 15px; display: block; }
  .ct-btn.selected { background: var(--track); }
  .ct-btn.selected:hover { background: #e2e9ec; }
  .ct-btn.ct-del { color: var(--accent); }
  .ct-btn.ct-del:hover { background: rgba(250,4,79,0.08); }
  .ct-btn.ct-del .ico { width: 17px; height: 17px; }
  .ct-btn.ct-photo { background: var(--ink); color: #fff; }
  .ct-btn.ct-photo:hover { background: #2a2d33; }
  .ct-btn.ct-rotate { background: var(--track); }
  .ct-btn.ct-rotate:hover { background: #e2e9ec; }
  .ct-sep { width: 1px; height: 18px; background: var(--border-2); flex: 0 0 auto; }
  .ct-types { display: flex; gap: 2px; flex: 0 0 auto; }
  .ct-label {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
    flex: 0 0 auto;
  }
  .ct-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 0 0 auto;
    width: 84px;
    height: 4px;
    border-radius: 4px;
    background: var(--track);
    outline: none;
    margin: 0;
    cursor: pointer;
  }
  .ct-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #000;
    border: none;
    cursor: pointer;
  }
  .ct-slider::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #000;
    border: none;
    cursor: pointer;
  }
  .ct-slider::-moz-range-track {
    height: 4px;
    border-radius: 4px;
    background: var(--track);
  }
  .ct-slider:disabled { opacity: 0.4; cursor: default; }

  /* ───── Hint line ───── */
  .hint-line {
    flex: 0 0 auto;
    margin: 0;
    min-height: 20px;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    text-align: center;
  }
  .hint-line.missed { color: var(--accent); }

  /* ───── Floating bottom toolbar ───── */
  .bottom-toolbar {
    flex: 0 0 auto;
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border-2);
    border-radius: 100px;
    box-shadow: var(--shadow-card);
    padding: 6px;
  }
  .tool {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink);
    border-radius: 100px;
    padding: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s, color 0.15s, opacity 0.15s;
  }
  .tool .ico { width: 18px; height: 18px; display: block; }
  .tool:hover { background: var(--hover); }
  .tool:disabled { opacity: 0.4; cursor: default; }
  .tool:disabled:hover { background: transparent; }
  .tool.tool-primary {
    background: var(--ink);
    color: #fff;
    box-shadow: var(--shadow-card);
  }
  .tool.tool-primary:hover { background: #2a2d33; }
  .tool.tool-danger { color: var(--accent); }
  .tool.tool-danger:hover { background: rgba(250,4,79,0.08); }
  .tool.tool-danger:disabled:hover { background: transparent; }
  .tool.exporting { cursor: progress; }

  #file-input { display: none; }

  /* ───── Drag ghost: the thumbnail that rides the cursor while a photo is carried to another cell ───── */
  #drag-ghost {
    position: fixed;
    z-index: 100;
    width: 96px;
    height: 96px;
    pointer-events: none;
    transform: translate(-50%, -60%) scale(0.4);
    transition: transform 0.12s ease-out;
  }
  #drag-ghost.lifted { transform: translate(-50%, -60%) scale(1); }
  #drag-ghost .ghost-img-wrap {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    border: 2px solid #fff;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
  }
  #drag-ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* An element carried in from the sidebar floats bare — no card, no border. */
  #drag-ghost.bare .ghost-img-wrap { border: none; background: transparent; box-shadow: none; border-radius: 0; }
  #drag-ghost.bare img { object-fit: contain; }
  #drag-ghost .ghost-badge {
    position: absolute;
    right: -8px;
    bottom: -8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-card);
  }
  #drag-ghost .ghost-badge svg { width: 13px; height: 13px; display: block; }
  body.dragging-move, body.dragging-move * { cursor: grabbing !important; }

  /* ───── Focus visibility (keyboard users) ───── */
  .tool:focus-visible,
  .ct-btn:focus-visible,
  .ct-slider:focus-visible,
  .element-thumb:focus-visible,
  .mode-chip:focus-visible,
  .format-thumb:focus-visible,
  .stroke-chip:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ───── Compact layouts ───── */
  @media (max-width: 860px) {
    .app-shell { flex-direction: column; }
    .sidebar {
      width: 100%;
      height: auto;
      flex-direction: row;
      justify-content: center;
    }
    .side-section:first-child { margin-top: 0; }
    .side-section:last-child  { margin-bottom: 0; }
    .sidebar {
      border-right: none;
      border-bottom: 1px solid var(--border-2);
      overflow-y: visible;
    }
    .side-section.elements {
      border-bottom: none;
      border-right: 1px solid var(--border-2);
      padding-bottom: 16px;
    }
    .side-section.formats { flex: 1 1 auto; min-width: 0; padding-bottom: 16px; }
    .side-note { display: none; }
    .element-list { width: auto; }
    .mode-list { width: 100%; max-width: 240px; }
    .collage-panel { width: 100%; }
    .format-list { display: flex; overflow-x: auto; padding-bottom: 4px; }
    .format-thumb { flex: 0 0 88px; }
    .main-column { padding: 20px; }
    .app-header { font-size: 18px; }
    .brand-face { height: 28px; }
    .canvas-area { padding: 16px 0; }
  }

  /* ───── Reduced motion ───── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <!-- ════════════════════════ LEFT SIDEBAR ════════════════════════ -->
    <aside class="sidebar">
      <section class="side-section elements" aria-label="Elemendid">
        <h2 class="side-heading">Elemendid</h2>
        <div class="element-list">
          <button class="element-thumb" id="add-quote" type="button" title="Lisa tsitaadimull" aria-label="Lisa tsitaadimull">
            <canvas class="el-preview" id="thumb-quote" width="144" height="144" aria-hidden="true"></canvas>
            <span class="el-name"><span class="el-plus">+</span> Tsitaat</span>
          </button>
          <button class="element-thumb" id="add-face" type="button" title="Lisa nägu ringis" aria-label="Lisa nägu ringis">
            <canvas class="el-preview" id="thumb-face" width="144" height="144" aria-hidden="true"></canvas>
            <span class="el-name"><span class="el-plus">+</span> Nägu</span>
          </button>
          <button class="element-thumb" id="add-blur" type="button" title="Lisa hägustav ring" aria-label="Lisa hägustav ring">
            <canvas class="el-preview" id="thumb-blur" width="144" height="144" aria-hidden="true"></canvas>
            <span class="el-name"><span class="el-plus">+</span> Hägu</span>
          </button>
        </div>
        <p class="side-note">Näoringi foto keskendatakse näole automaatselt.</p>
      </section>
      <section class="side-section formats" aria-label="Formaat">
        <h2 class="side-heading">Formaat</h2>
        <div class="mode-list" role="radiogroup" aria-label="Formaat">
          <button class="mode-chip" id="mode-single" type="button" role="radio" aria-checked="false" title="Üks 16:9 pilt" aria-label="Üks pilt">
            <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="1.5"/></svg>
            <span>Üks pilt</span>
          </button>
          <button class="mode-chip selected" id="mode-collage" type="button" role="radio" aria-checked="true" aria-expanded="true" aria-controls="collage-panel" title="Kollaaž mitmest fotost" aria-label="Kollaaž">
            <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="1.5"/><path d="M12 5.5v13"/><path d="M12 12h9.5"/></svg>
            <span>Kollaaž</span>
          </button>
        </div>
        <!-- Unfolds under "Kollaaž": the ten Kollaažer grids and the seam colour. -->
        <div class="collage-panel open" id="collage-panel">
          <div class="collage-inner">
            <div class="format-list" id="format-list" role="radiogroup" aria-label="Kollaaži ruudustik"></div>

  <script>
  "use strict";

  /* ═══════════════════════ Design constants (Figma "Delfi Arvamus", 148:2) ═══════════════════════

     so they stay crisp at any size and the shadows scale with the element. All shadow

  /* Quote bubble: a 386 px circle (centre 248.93, 225.18 in a 474×457 viewBox), the
     two comma glyphs, and a tail towards bottom-left. */

    tail: "M28 424.576L119.399 336.361L154.081 393.86L28 424.576Z",
    glyphs: [
      "M174.355 241.925C165.84 264.284 155.432 277.396 147.94 286.654C145.02 290.263 148.624 295.577 153.022 294.002C204.8 275.501 232.254 241.717 240.735 210.36C248.02 183.324 234.588 151.55 207.163 141.113C179.737 130.677 149.022 144.453 138.633 171.887C127.706 200.638 144.013 233.242 174.393 241.981L174.355 241.925Z",
      "M301.871 265.684C293.356 288.043 282.947 301.155 275.456 310.413C272.535 314.022 276.139 319.336 280.538 317.761C332.268 299.251 359.77 265.476 368.251 234.118C375.536 207.083 362.104 175.309 334.678 164.872C307.253 154.436 276.538 168.212 266.149 195.646C255.221 224.397 271.576 257.01 301.909 265.74L301.871 265.684Z",

    // Tail corners relative to the circle centre, in units of the diameter (hit-testing).
