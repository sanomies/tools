<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onu Sano · DIY</title>
<meta name="description" content="Onu Sano tööriistad — vali tööriist, mida soovid kasutada.">
<meta property="og:title" content="Onu Sano · DIY">
<meta property="og:description" content="Onu Sano tööriistad — vali tööriist, mida soovid kasutada.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Shared page transition — slides tools in from the right (reversed on Back). -->
<link rel="stylesheet" href="assets/transition.css">
<script src="assets/transition.js"></script>
<style>
  /* ─────────────────────────────────────────────────────────────
     Onu Sano · DIY — tool launcher
     House style (Delfi light theme): near-white base, near-black ink.
     A minimal centered list of tool names; the hovered name grows and
     its one-liner appears under the list. One family: Google Sans Flex.
     ───────────────────────────────────────────────────────────── */
  :root {
    --bg:           #fbfbfc;   /* app base */
    --ink:          #111317;   /* near-black: headings + solid fills */
    --muted:        #708597;   /* delfi-darkgray: secondary text */
    --focus:        #000000;   /* keyboard focus ring */
    --name-size:    clamp(28px, 5.2vw, 46px);   /* tool name type size */
    --preview-w:    336px;                      /* cursor thumbnail width (16:9) */
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "Google Sans Flex", "Google Sans", "Product Sans", "DM Sans",
                 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--ink);
    color-scheme: light;
    background-color: var(--bg);
    height: 100dvh;
    overflow: hidden;   /* app shell: the short list always fits */
    padding: 40px;      /* breathing room around the whole page */
    display: flex;
    flex-direction: column;
  }

  /* ───── Page shell ───── */
  .page {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    padding: 48px 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;   /* the whole page reads down the centre */
  }

  /* ───── Brand header (shared pattern: face · Onu Sano® · sub) ───── */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0;
    font-size: 39px;
    line-height: 1.2;
    font-weight: 400;
    user-select: none;
    -webkit-user-select: none;
  }
  .brand-face {
    height: 60px; width: auto; display: block;
    transform-origin: right center;   /* pivot from the middle-right */
    transition: transform .2s ease;
  }
  .app-header:hover .brand-face { transform: rotate(-4deg); }
  .brand-name { font-weight: 700; }
  .brand-sub  { font-weight: 300; }

  /* Page-transition names — launcher-scoped (see assets/transition.css). Kept here,
     not in the shared file, so they don't collide with tools' reused class names. */
  .app-header  { view-transition-name: vt-header; }
  .page-footer { view-transition-name: vt-footer; }

  /* ───── Tool list — names stacked in the free space between the lede
     and the footer; the hovered (or keyboard-focused) name grows and its
     description appears under the list. ───── */
  .tools {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding: 24px 0;
  }
  .tool {
    display: block;
    font-size: var(--name-size);
    font-weight: 600;
    line-height: 1.15;
    white-space: nowrap;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    transform-origin: center;   /* centred names grow evenly outward */
    transition: transform .22s cubic-bezier(.3, 1.4, .5, 1);
    will-change: transform;
  }
  /* --tilt is rolled to a fresh random angle (≤3°) on every hover — see
     the script. */
  .tool:hover,
  .tool:focus-visible { transform: scale(1.14) rotate(var(--tilt, 0deg)); }
  .tool:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 6px;
    border-radius: 8px;
  }
  /* The hovered tool's icon + one-liner, under the list. The slot keeps
     its height while empty so the list never shifts. */
  .tool-desc {
    margin: 26px 0 0;
    min-height: 24px;
    max-width: min(80vw, 560px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.45;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .tool-desc.show { opacity: 1; transition: opacity .3s ease .05s; }
  .tool-desc img {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    flex: 0 0 auto;
    display: block;
  }

  /* ───── Site preview — a small 16:9 screenshot of the hovered tool that
     rides along with the cursor. Decorative: it takes no clicks and is
     hidden from AT, from touch, and from windows too narrow for it. ───── */
  .preview {
    position: fixed;
    top: 0;
    left: 0;                 /* the script drives it by transform */
    width: var(--preview-w);
    z-index: 5;
    perspective: 700px;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity .16s ease, visibility 0s linear .16s;
  }
  .preview.show {
    opacity: 1;
    visibility: visible;
    transition: opacity .18s ease;
  }
  .preview-card {
    /* A 16:9 thumbnail of the tool's own screenshot (assets/previews/). */
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 10px 30px rgba(17, 19, 23, .16);
    /* --ry/--rx lean the card into the cursor's direction of travel;
       --pop scales it up as it appears. */
    transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)) scale(var(--pop, .9));
    transition: transform .18s ease-out;
    will-change: transform;
  }
  .preview.show .preview-card { --pop: 1; }
  .preview-card img {
    /* Held blank until the shot has decoded, so no half-drawn tool shows. */
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .preview-card img.ready { opacity: 1; }
  @media (hover: none), (max-width: 600px) {
    .preview { display: none; }  /* no cursor to ride along with */
  }

  /* ───── Footer ───── */
  .page-footer {
    flex: 0 0 auto;
    width: 100%;
    padding: 24px;
    text-align: center;
    color: var(--ink);
    font-size: 20px;
    font-weight: 400;
  }

  /* ───── First-load intro — elements rise in on a direct visit. (A
     Back/Forward navigation animates via the shared page transition, so
     .intro is only added when there's no view transition.) ───── */
  @keyframes os-intro { from { opacity: 0; transform: translateY(18px); } }
  html.intro .app-header   { animation: os-intro .5s cubic-bezier(.65, 0, .35, 1) both; }
  html.intro .tools > *    { animation: os-intro .5s cubic-bezier(.65, 0, .35, 1) both; }
  html.intro .tools > *:nth-child(1) { animation-delay: .12s; }
  html.intro .tools > *:nth-child(2) { animation-delay: .17s; }
  html.intro .tools > *:nth-child(3) { animation-delay: .22s; }
  html.intro .tools > *:nth-child(4) { animation-delay: .27s; }
  html.intro .tools > *:nth-child(5) { animation-delay: .32s; }
  html.intro .tools > *:nth-child(6) { animation-delay: .37s; }
  html.intro .page-footer  { animation: os-intro .5s cubic-bezier(.65, 0, .35, 1) .48s both; }
  @media (prefers-reduced-motion: reduce) {
    html.intro .app-header,
    html.intro .tools > *,
    html.intro .page-footer { animation: none; }
  }

  /* ───── Responsive ───── */
  @media (max-width: 600px) {
    .page { padding: 40px 18px 0; }
    .page-footer { padding: 20px 18px; }
    .app-header { font-size: 33px; }
    .brand-face { height: 51px; }
    .tools { gap: 24px; }
  }
  /* Short windows: tighten so the whole list stays in view. */
  @media (max-height: 700px) {
    :root { --name-size: clamp(24px, 4.2vw, 36px); }
    .tools { gap: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
    .tool:hover, .tool:focus-visible { transform: none; }
  }
</style>
</head>
<body>
  <main class="page">
    <h1 class="app-header">
      <img class="brand-face" src="assets/onu-sano-face.svg" alt="" aria-hidden="true">
      <span class="brand-name">Onu Sano®</span>
      <span class="brand-sub">DIY</span>
    </h1>

    <!-- id="toolGrid" stays here: assets/transition.js recognises the
         launcher by it and skips its automatic region naming. -->
    <nav class="tools" id="toolGrid" aria-label="DIY"></nav>
  </main>

  <!-- Cursor-following 16:9 screenshot of the hovered tool — decorative only. -->
  <aside class="preview" aria-hidden="true">
    <div class="preview-card">
      <img alt="">
    </div>
  </aside>

  <footer class="page-footer">
    © <span id="year"></span> Onu Sano®
  </footer>

  <script>
    /* ───────────────────────────────────────────────────────────
       TOOLS — the single source of truth for the launcher.
       To add a tool: append one object here. No other edits needed.
         name : shown on the list
         desc : one-line Estonian description, shown under the list
                while the name is hovered
         href : path to the tool (relative to this folder)
         icon : path to the tool's icon image (80×80 tile), shown
                beside the description
         shot : 16:9 screenshot shown in the card that follows the
                cursor — re-shoot it when the tool's look changes
                (see README → "Tool screenshots")
       ─────────────────────────────────────────────────────────── */
    const TOOLS = [
      {
        name: "A&S Video editor",
        desc: "Laadi video üles, lisa subtiitrid ja tee sellest Instagrami-valmis klipp.",
        href: "as-video-editor/",
        icon: "assets/icons/annestiil.svg",
        shot: "assets/previews/as-video-editor.jpg",
      },
      {
        name: "Podcast framer",
        desc: "Säti foto bränditud raami ja laadi valmis artikli pilt alla.",
        href: "podcast/",
        icon: "assets/icons/podcast.svg",
        shot: "assets/previews/podcast.jpg",
      },
      {
        name: "Geenius social",
        desc: "Vali kujundus, lisa sisu ja laadi valmis sotsiaalmeedia pilt alla.",
        href: "geenius-social/",
        icon: "assets/icons/geenius.svg",
        shot: "assets/previews/geenius-social.jpg",
      },
      {
        name: "Ekspress editorial",
        desc: "Säti foto Ekspressi raami ja laadi valmis pilt alla.",
        href: "ekspress-editorial/",
        icon: "assets/icons/ekspress.svg",
        shot: "assets/previews/ekspress-editorial.jpg",
      },
      {
        name: "Bänneripigistaja",
        desc: "Laadi bännerid üles, meie pigistame need parajaks.",
        href: "pigistaja/",
        icon: "assets/icons/pigistaja.svg",
        shot: "assets/previews/pigistaja.jpg",
        delay: 200,   // ms to wait after click before navigating
      },
      {
        name: "Kollaažer",
        desc: "Vali ruudustik, lisa fotod ja laadi valmis kollaaž alla.",
        href: "collage/",
        icon: "assets/icons/collage.svg",
        shot: "assets/previews/collage.jpg",
      },
      {
        name: "Hägustaja",
        desc: "Laadi pilt üles, kata näod ringidega ja hägusta või pikselda need.",
        href: "blur/",
        icon: "assets/icons/blur.svg",
        shot: "assets/previews/blur.jpg",
      },
    ];
    const grid = document.getElementById("toolGrid");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)");

    for (const [i, tool] of TOOLS.entries()) {
      const item = document.createElement("a");
      item.className = "tool";
      item.href = encodeURI(tool.href);
      item.textContent = tool.name;
      item.dataset.i = i;
      grid.appendChild(item);
    }

    /* The hovered tool's icon + description, under the list. */
    const descEl = document.createElement("p");
    descEl.className = "tool-desc";
    const descIcon = document.createElement("img");
    descIcon.alt = "";
    const descText = document.createElement("span");
    descEl.append(descIcon, descText);
    grid.appendChild(descEl);

    function showDesc(item) {
      const tool = TOOLS[item.dataset.i];
      descText.textContent = tool.desc;
      descIcon.src = encodeURI(tool.icon);
      descEl.classList.add("show");
    }
    /* Each hover tips the name a fresh random amount, up to ±3° — never
       twice the same: at least 0.8° so the tilt reads at all, and at least
       0.5° away from the previous roll. */
    let lastTilt = 0;
    function rollTilt(item) {
      let t;
      do { t = (Math.random() * 2 - 1) * 3; }
      while (Math.abs(t) < 0.8 || Math.abs(t - lastTilt) < 0.5);
      lastTilt = t;
      item.style.setProperty("--tilt", t.toFixed(2) + "deg");
    }

    /* Hover and keyboard focus share the same reveal. Leaving one name for
       the next re-shows in the same tick, so the slot never flickers. */
    grid.addEventListener("mouseover", (e) => {
      const item = e.target.closest(".tool");
      if (item) { rollTilt(item); showDesc(item); showPreview(item, e); }
    });
    grid.addEventListener("mouseout", (e) => {
      if (e.target.closest(".tool")) { descEl.classList.remove("show"); hidePreview(); }
    });
    grid.addEventListener("focusin", (e) => {
      const item = e.target.closest(".tool");
      if (item) { rollTilt(item); showDesc(item); showPreview(item, e); }
    });
    grid.addEventListener("focusout", () => { descEl.classList.remove("show"); hidePreview(); });

    /* ── Site preview — a small 16:9 screenshot of the hovered tool that
       rides along with the cursor. The shots are stored images, not live
       pages (assets/previews/ — see README → "Tool screenshots"). */
    const previewEl   = document.querySelector(".preview");
    const previewCard = document.querySelector(".preview-card");
    const previewImg  = previewCard.querySelector("img");
    const previewW = parseFloat(
      getComputedStyle(previewEl).getPropertyValue("--preview-w")) || 336;
    const previewH = previewW * 9 / 16;

    let previewIdx = -1;
    previewImg.addEventListener("load", () => previewImg.classList.add("ready"));

    /* Where the card wants to be (tx/ty) vs. where it is (px/py): it eases
       after the cursor rather than sticking rigidly, and leans into the
       direction of travel. */
    const OFF_X = 24, OFF_Y = 20;   // gap from the cursor's hot spot
    let px = 0, py = 0, tx = 0, ty = 0, raf = 0, previewShown = false;

    function aimAt(x, y) {
      /* Flip to the other side of the cursor near a screen edge. */
      tx = x + OFF_X + previewW > innerWidth  - 12 ? x - OFF_X - previewW : x + OFF_X;
      ty = y + OFF_Y + previewH > innerHeight - 12 ? y - OFF_Y - previewH : y + OFF_Y;
      tx = Math.max(12, tx);
      ty = Math.max(12, ty);
    }
    function follow() {
      raf = 0;
      const k  = reduced.matches ? 1 : .22;
      const dx = tx - px, dy = ty - py;
      px += dx * k;
      py += dy * k;
      previewEl.style.transform =
        `translate3d(${px.toFixed(1)}px, ${py.toFixed(1)}px, 0)`;
      if (!reduced.matches) {
        const lean = (v, m) => Math.max(-9, Math.min(9, v * m)).toFixed(2) + "deg";
        previewCard.style.setProperty("--ry", lean(dx,  .12));
        previewCard.style.setProperty("--rx", lean(dy, -.09));
      }
      if (previewShown) raf = requestAnimationFrame(follow);
    }

    function showPreview(item, e) {
      /* Anchor to the cursor — or, when the name was reached by keyboard,
         to the name's own right edge. */
      if (e && e.type !== "focusin") aimAt(e.clientX, e.clientY);
      else {
        const r = item.getBoundingClientRect();
        aimAt(r.right + 8, r.top + r.height / 2);
      }
      if (!previewShown) {          // appear where the pointer is, no fly-in
        px = tx; py = ty;
        previewEl.style.transform = `translate3d(${px}px, ${py}px, 0)`;
        previewShown = true;
        previewEl.classList.add("show");
        if (!raf) raf = requestAnimationFrame(follow);
      }
      loadPreview(+item.dataset.i);
    }
    function hidePreview() {
      previewShown = false;         // the follow loop stops on its next frame
      previewEl.classList.remove("show");
    }
    function loadPreview(i) {
      if (i === previewIdx) return;   // already in the card
      previewIdx = i;
      previewImg.classList.remove("ready");
      previewImg.src = encodeURI(TOOLS[i].shot);
      if (previewImg.complete) previewImg.classList.add("ready");   // cached
    }

    /* Warm the cache once the launcher itself has loaded, so the first
       hover has its shot ready. */
    addEventListener("load", () => {
      const warm = () => { for (const t of TOOLS) new Image().src = encodeURI(t.shot); };
      if ("requestIdleCallback" in window) requestIdleCallback(warm);
      else setTimeout(warm, 500);
    });

    addEventListener("mousemove", (e) => {
      if (previewShown) aimAt(e.clientX, e.clientY);
    }, { passive: true });

    /* Back to a bfcache-restored launcher: the pointer is nowhere yet. */
    addEventListener("pageshow", () => {
      descEl.classList.remove("show");
      hidePreview();
    });

    grid.addEventListener("click", (e) => {
      const item = e.target.closest(".tool");
      if (!item) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      // Optional short pause before navigating (Bänneripigistaja's splash).
      const delay = TOOLS[+item.dataset.i].delay;
      if (delay) { e.preventDefault(); setTimeout(() => { location.href = item.href; }, delay); }
    });

    /* Name each tool so it animates independently in the page transition
       (staggered down on exit, up on return — assets/transition.css). */
    document.querySelectorAll(".tool").forEach((item, i) => {
      if (i < 12) item.style.viewTransitionName = "vt-card-" + i;
    });

    document.getElementById("year").textContent = new Date().getFullYear();

    /* First entry (a direct load / reload, not a Back/Forward page transition):
       animate the elements in. Added before first paint so there's no flash. */
    addEventListener("pagereveal", (e) => {
      if (e.viewTransition) return;
      const root = document.documentElement;
      root.classList.add("intro");
      setTimeout(() => root.classList.remove("intro"), 1300);
    });
  </script>
</body>
</html>
